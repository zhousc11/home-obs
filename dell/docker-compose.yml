services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/incidents:/var/lib/grafana/incidents:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_DOMAIN=nas.zhoushicheng.cn
      - GF_SERVER_ROOT_URL=https://nas.zhoushicheng.cn/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
      - HTTP_PROXY=http://192.168.66.84:7890
      - HTTPS_PROXY=http://192.168.66.84:7890
      - NO_PROXY=localhost,127.0.0.1,prometheus,grafana,incident-recorder,192.168.66.108,192.168.66.152,192.168.66.208,.local
    depends_on:
      - prometheus
      - incident-recorder
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  incident-recorder:
    image: python:3.12-alpine
    container_name: incident-recorder
    restart: unless-stopped
    working_dir: /app
    command: ["python", "/app/recorder.py"]
    ports:
      - "8088:8088"
    volumes:
      - ./incident-recorder:/app:ro
      - ./data/incidents:/data
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - BLACKBOX_URL=http://192.168.66.108:9115
      - SQLITE_PATH=/data/incidents.db
      - INTERVAL_SECONDS=5
      - HTTP_TIMEOUT_SECONDS=6
      - DEBUG_TIMEOUT_SECONDS=8
      - UTC_OFFSET_HOURS=8
      - ANALYZE_HTTP_PORT=8088
      - REQUIRE_GRAFANA_AUTH=${REQUIRE_GRAFANA_AUTH:-true}
      - GRAFANA_AUTH_URL=http://grafana:3000/api/user
      - GRAFANA_AUTH_TIMEOUT_SECONDS=5
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LLM_HTTP_TIMEOUT_SECONDS=60
      - PI_INGEST_TOKEN=${PI_INGEST_TOKEN:-}
      - INGEST_MAX_BODY_CHARS=500000
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
      - "--collector.systemd"
      - "--collector.processes"
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
