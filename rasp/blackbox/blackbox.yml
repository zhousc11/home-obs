modules:
  icmp_v4:
    prober: icmp
    timeout: 1.5s
    icmp:
      preferred_ip_protocol: ip4

  icmp_v6:
    prober: icmp
    timeout: 1.5s
    icmp:
      preferred_ip_protocol: ip6
      ip_protocol_fallback: false

  tcp_443:
    prober: tcp
    timeout: 1.5s
    tcp:
      preferred_ip_protocol: ip4

  tcp_443_v6:
    prober: tcp
    timeout: 1.5s
    tcp:
      preferred_ip_protocol: ip6
      ip_protocol_fallback: false

  https_2xx_4xx:
    prober: http
    timeout: 3s
    http:
      preferred_ip_protocol: ip4
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 204, 301, 302, 401, 403, 404]
      method: GET
      fail_if_ssl: false
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false

  https_2xx_4xx_v6:
    prober: http
    timeout: 3s
    http:
      preferred_ip_protocol: ip6
      ip_protocol_fallback: false
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 204, 301, 302, 401, 403, 404]
      method: GET
      fail_if_ssl: false
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false

  dns_a:
    prober: dns
    timeout: 1.5s
    dns:
      preferred_ip_protocol: ip4
      query_name: "baidu.com"
      query_type: "A"

  dns_aaaa_ip_zhoushicheng_v6:
    prober: dns
    timeout: 1.5s
    dns:
      preferred_ip_protocol: ip6
      ip_protocol_fallback: false
      query_name: "ip.zhoushicheng.cn"
      query_type: "AAAA"
